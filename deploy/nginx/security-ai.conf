# security-ai.conf — nginx Reverse-Proxy mit TLS
# Reviewed: GO mit Auflagen 263-304.
#
# Deployment: Datei nach /etc/nginx/sites-available/ kopieren,
# Symlink nach /etc/nginx/sites-enabled/ setzen (Auflage 304).

# --- Default: unbekannte Hosts ablehnen -----------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/ssl/certs/security-ai.crt;
    ssl_certificate_key /etc/ssl/private/security-ai.key;
    return 444;
}

# --- HTTP: nur Redirect auf HTTPS ------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name security-ai.local security-ai 192.168.178.117 127.0.0.1 localhost;

    # Kein Content auf Port 80, nur Redirect.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: TLS-Terminierung, Proxy an Flask -------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name security-ai.local security-ai 192.168.178.117 127.0.0.1 localhost;

    # Zertifikate (Auflage 265)
    ssl_certificate     /etc/ssl/certs/security-ai.crt;
    ssl_certificate_key /etc/ssl/private/security-ai.key;

    # TLS: nur 1.2 und 1.3 (Auflage 264)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (Auflage 252 + 268), nur ueber HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logs (Auflage 270)
    access_log /var/log/nginx/security-ai.access.log combined;
    error_log  /var/log/nginx/security-ai.error.log;

    # Proxy an Flask auf 127.0.0.1:5000 (Auflage 267)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Kein proxy_set_header fuer CSP / andere Security-Header:
        # die kommen aus Flask und werden unveraendert durchgereicht
        # (Auflage 261 + 267).
    }
}
