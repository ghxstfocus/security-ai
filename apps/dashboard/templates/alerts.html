{#
  alerts.html — Liste der letzten risk_assessment-Eintraege.

  Kategorie 3 (Template, CSP).
  Kein |safe, kein style="...", kein inline <script>,
  kein on*=, kein tojson.

  Punkt 79 / 79a: sieben Spalten mit Kontext.
  - Zeitpunkt
  - Was (Klartext aus alert_text)
  - Geraet (internal_name or entity_name or identifier,
    Link zu /inventory/<id> nur wenn can_view_inventory;
    Netz als zweite Zeile darunter)
  - IP (display_ip, Fallback "-")
  - Begruendung (reasons, sonst "-")
  - Bewertung (Badge + Score)
  - Link (auf /audit/<audit_id>, nur wenn can_view_audit)
#}
{% extends "base.html" %}

{% block content %}
<h1>Alarme</h1>
{% if assessments %}
<table class="table table-alerts">
    <thead>
        <tr>
            <th>Zeitpunkt</th>
            <th>Was</th>
            <th>Geraet</th>
            <th>IP</th>
            <th>Begruendung</th>
            <th>Bewertung</th>
            <th>Link</th>
        </tr>
    </thead>
    <tbody>
        {% for a in assessments %}
        <tr>
            <td>{{ a.timestamp|format_ts }}</td>
            <td>{{ a.alert_text }}</td>
            <td class="alert-device">
                {% if a.identifier %}
                    {% set disp = a.internal_name or a.entity_name or a.identifier %}
                    {% if can_view_inventory %}
                    <a class="alert-device-identifier"
                       href="/inventory/{{ a.identifier }}">{{ disp }}</a>
                    {% else %}
                    <span class="alert-device-identifier">{{ disp }}</span>
                    {% endif %}
                    {% if a.network_type %}
                    <span class="alert-device-network">{{ a.network_type }}</span>
                    {% endif %}
                {% else %}
                —
                {% endif %}
            </td>
            <td>{{ a.display_ip }}</td>
            <td>
                {% if a.reasons %}
                    {{ a.reasons|join(", ") }}
                {% else %}
                —
                {% endif %}
            </td>
            <td>
                {% if a.category == "SECURITY_ALERT" %}
                <span class="badge badge-red">{{ a.category|format_score_label }}</span>
                {% elif a.category == "CONFIRMED" %}
                <span class="badge badge-red">{{ a.category|format_score_label }}</span>
                {% elif a.category == "SUSPICION" %}
                <span class="badge badge-yellow">{{ a.category|format_score_label }}</span>
                {% elif a.category == "ANOMALY" %}
                <span class="badge badge-cyan">{{ a.category|format_score_label }}</span>
                {% elif a.category == "EVENT" %}
                <span class="badge badge-cyan">{{ a.category|format_score_label }}</span>
                {% else %}
                <span class="badge badge-cyan">{{ a.category|format_score_label }}</span>
                {% endif %}
                <br>
                {{ a.score|format_score }}
            </td>
            <td>
                {% if can_view_audit and a.audit_id %}
                <a href="/audit/{{ a.audit_id }}">Detail</a>
                {% else %}
                —
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p>Keine Alarme in den letzten 24 Stunden.</p>
{% endif %}
{% endblock %}
