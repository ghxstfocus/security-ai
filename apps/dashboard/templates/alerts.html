{#
  alerts.html — Liste der letzten risk_assessment-Eintraege.

  Kategorie 3 (Template, CSP).
  Kein |safe, kein style="...", kein inline <script>,
  kein on*=, kein tojson.

  Punkt 79 / 79a: sieben Spalten mit Kontext.
  - Zeitpunkt
  - Was (Klartext aus alert_text)
  - Geraet (internal_name or entity_name or identifier,
    Link zu /inventory/<id> nur wenn can_view_inventory;
    Netz als zweite Zeile darunter)
  - IP (display_ip, Fallback "-")
  - Begruendung (reasons, sonst "-")
  - Bewertung (Badge + Score)
  - Link (auf /audit/<audit_id>, nur wenn can_view_audit)
#}
{% extends "base.html" %}

{% block content %}
<h1>Alarme</h1>

{# Filterleiste (Punkt 80). GET, kein CSRF. #}
<form method="GET" action="/alerts" class="filter-bar">
    <label>
        <span>Zeitraum</span>
        <select name="since">
            {% for h in since_values %}
            <option value="{{ h }}"{% if h == filter_since %} selected{% endif %}>{% if h == 24 %}24 h{% elif h == 168 %}7 Tage{% elif h == 720 %}30 Tage{% else %}{{ h }} h{% endif %}</option>
            {% endfor %}
        </select>
    </label>
    <label>
        <span>Kategorie</span>
        <select name="category">
            <option value=""{% if not filter_category %} selected{% endif %}>Alle</option>
            {% for code, label in category_values.items() %}
            <option value="{{ code }}"{% if code == filter_category %} selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </label>
    <label>
        <span>Geraet</span>
        <select name="identifier">
            <option value=""{% if not filter_identifier %} selected{% endif %}>Alle</option>
            {% for d in devices %}
            {% set label = d.internal_name or d.entity_name or d.identifier %}
            <option value="{{ d.identifier }}"{% if d.identifier == filter_identifier %} selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </label>
    <label>
        <span>Netz</span>
        <select name="network_type">
            <option value=""{% if not filter_network_type %} selected{% endif %}>Alle</option>
            {% for nt in network_type_values %}
            <option value="{{ nt }}"{% if nt == filter_network_type %} selected{% endif %}>{{ nt }}</option>
            {% endfor %}
        </select>
    </label>
    <label>
        <span>Suche</span>
        <input type="text" name="q" minlength="2" maxlength="200" value="{{ filter_q }}" placeholder="Geraet, Text, MAC">
    </label>
    <button type="submit">Filtern</button>
</form>

{% if assessments %}
<table class="table table-alerts">
    <thead>
        <tr>
            <th>Zeitpunkt</th>
            <th>Was</th>
            <th>Geraet</th>
            <th>IP</th>
            <th>Begruendung</th>
            <th>Bewertung</th>
            <th>Link</th>
        </tr>
    </thead>
    <tbody>
        {% for a in assessments %}
        <tr>
            <td>{{ a.timestamp|format_ts }}</td>
            <td>{{ a.alert_text }}</td>
            <td class="alert-device">
                {% if a.identifier %}
                    {% set disp = a.internal_name or a.entity_name or a.identifier %}
                    {% if can_view_inventory %}
                    <a class="alert-device-identifier"
                       href="/inventory/{{ a.identifier }}">{{ disp }}</a>
                    {% else %}
                    <span class="alert-device-identifier">{{ disp }}</span>
                    {% endif %}
                    {% if a.network_type %}
                    <span class="alert-device-network">{{ a.network_type }}</span>
                    {% endif %}
                {% else %}
                —
                {% endif %}
            </td>
            <td>{{ a.display_ip }}</td>
            <td>
                {% if a.reasons %}
                    {{ a.reasons|join(", ") }}
                {% else %}
                —
                {% endif %}
            </td>
            <td>
                {% if a.category == "SECURITY_ALERT" %}
                <span class="badge badge-red">{{ a.category|format_score_label }}</span>
                {% elif a.category == "CONFIRMED" %}
                <span class="badge badge-red">{{ a.category|format_score_label }}</span>
                {% elif a.category == "SUSPICION" %}
                <span class="badge badge-yellow">{{ a.category|format_score_label }}</span>
                {% elif a.category == "ANOMALY" %}
                <span class="badge badge-cyan">{{ a.category|format_score_label }}</span>
                {% elif a.category == "EVENT" %}
                <span class="badge badge-cyan">{{ a.category|format_score_label }}</span>
                {% else %}
                <span class="badge badge-cyan">{{ a.category|format_score_label }}</span>
                {% endif %}
                <br>
                {{ a.score|format_score }}
            </td>
            <td>
                {% if can_view_audit and a.audit_id %}
                <a href="/audit/{{ a.audit_id }}">Detail</a>
                {% else %}
                —
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{# Pagination (Punkt 80). #}
{% if pages > 1 %}
<nav class="pagination">
    {% if page > 1 %}
    <a href="/alerts?since={{ filter_since }}{% if filter_category %}&category={{ filter_category|urlencode }}{% endif %}{% if filter_identifier %}&identifier={{ filter_identifier|urlencode }}{% endif %}{% if filter_network_type %}&network_type={{ filter_network_type|urlencode }}{% endif %}{% if filter_q %}&q={{ filter_q|urlencode }}{% endif %}&page={{ page - 1 }}">Zurueck</a>
    {% else %}
    <span class="pagination-disabled">Zurueck</span>
    {% endif %}
    <span class="pagination-info">Seite {{ page }} von {{ pages }} ({{ total }} Eintraege)</span>
    {% if page < pages %}
    <a href="/alerts?since={{ filter_since }}{% if filter_category %}&category={{ filter_category|urlencode }}{% endif %}{% if filter_identifier %}&identifier={{ filter_identifier|urlencode }}{% endif %}{% if filter_network_type %}&network_type={{ filter_network_type|urlencode }}{% endif %}{% if filter_q %}&q={{ filter_q|urlencode }}{% endif %}&page={{ page + 1 }}">Weiter</a>
    {% else %}
    <span class="pagination-disabled">Weiter</span>
    {% endif %}
</nav>
{% endif %}

{% else %}
<p>Keine Alarme gefunden.</p>
{% endif %}
{% endblock %}
