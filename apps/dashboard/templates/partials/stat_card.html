{#
  stat_card.html — Makro fuer Kennzahl-Karten.

  Auflage 297: Makro statt include-with.
  Kein |safe, kein style="...".
  accent default cyan.
#}
{% macro stat_card(label, value, accent="cyan", data_card=None) %}
<div class="card card-accent-{{ accent }}"{% if data_card %} data-card="{{ data_card }}"{% endif %}>
    <div class="card-label">{{ label }}</div>
    <div class="card-value">{{ value }}</div>
</div>
{% endmacro %}
