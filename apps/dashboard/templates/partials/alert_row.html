{#
  alert_row.html — Eine Zeile in der Alerts-Tabelle.

  Parameter:
    severity — info|warning|critical
    message  — Text
    timestamp — ISO-8601
#}
<tr>
    <td><span class="badge badge-{{ severity|default('cyan') }}">{{ severity|default('info') }}</span></td>
    <td>{{ message|default('') }}</td>
    <td>{{ timestamp|default('') }}</td>
</tr>
