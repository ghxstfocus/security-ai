{#
  topbar.html — Obere Leiste.

  Auflage 251: g.principal mit is defined-Pruefung.
#}
<header class="topbar">
    <button id="nav-toggle" type="button" class="nav-toggle" aria-label="Navigation ein-/ausblenden" aria-expanded="false" aria-controls="sidebar">
        <img src="{{ url_for('static', filename='img/hamburger.svg') }}" alt="">
    </button>
    <form class="topbar-search" action="/search" method="get">
        <input type="search" name="q" maxlength="200" minlength="2"
               placeholder="Suchen..." aria-label="Suche">
    </form>
    <div class="topbar-user">
        {% if g.principal is defined and g.principal %}
        <span>{{ g.principal }}</span>
        {% else %}
        <span>Nicht eingeloggt</span>
        {% endif %}
    </div>
</header>
