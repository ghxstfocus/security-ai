{#
  tools.html — Werkbank-Uebersicht (Punkt 58, Runde 1).

  Kategorie 3 (Template, CSP).
  Kein |safe, kein style=, kein on*, kein inline <script>.

  Commit 4a: minimale Seite, damit Route-Tests gruen sind.
  Commit 4b: Erweiterung zur Werkbank (3 Abschnitte,
  Formulare, JS).
#}
{% extends "base.html" %}

{% block content %}
<h1>Werkzeuge</h1>

{% if can_view_tool_net_diag and tools_by_group.netzwerk.tools %}
<section id="netzwerk" class="tool-section">
    <h2>{{ tools_by_group.netzwerk.label }}</h2>
    {% for tool in tools_by_group.netzwerk.tools %}
    <div class="tool-card" data-tool="{{ tool.name }}">
        <h3>{{ tool.label }}</h3>
        {% if tool.description %}
        <p class="tool-desc">{{ tool.description }}</p>
        {% endif %}
        <form class="tool-form" data-tool="{{ tool.name }}">
            {% for field in tool.fields %}
            <label class="tool-field">
                <span>{{ field.label }}</span>
                <input name="{{ field.name }}"
                       type="{{ field.type }}"
                       {% if field.required %}required{% endif %}>
            </label>
            {% endfor %}
            <button type="submit" class="button-primary">
                Ausfuehren
            </button>
        </form>
        <pre class="tool-output" hidden></pre>
    </div>
    {% endfor %}
</section>
{% endif %}

{% endblock %}
