[project]
name = "homelab-security-ai"
version = "0.1.0"
description = "Modulares, defensives Security- und Admin-System für autorisierte IT-Umgebungen"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Ghxst" }]

dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "psutil>=5.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
scanner = [
    "scapy>=2.5",
    "fritzconnection>=1.13",
    "docker>=7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[tool.setuptools.packages.find]
include = [
    "apps*",
    "core*",
    "harness*",
    "tools*",
]
exclude = [
    "data*",
    "deploy*",
    "changes*",
    "policies*",
    "detection*",
    "tests*",
    "docs*",
    "scripts*",
    "audit-logs*",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
