# Policy Engine — Regeln pro Tool.
#
# Kein eval, kein DSL. Pruefer-Namen muessen in
# harness/policy_engine/engine.py existieren.
#
# Globale Pruefer laufen IMMER, unabhaengig von dieser Datei:
#   no_shell_chars, no_path_traversal, no_null_bytes
# Sie duerfen NICHT in conditions stehen.
#
# Spezifische Pruefer laufen nur, wenn in conditions genannt:
#   authorized_target  (weich -> APPROVAL_REQUIRED)
#   read_only_path     (weich -> APPROVAL_REQUIRED)
#   target_in_scope    (weich -> APPROVAL_REQUIRED)
#
# Felder pro Tool:
#   allowed:         bool (Default true)
#   level:           int 0-5 (Default 0)
#   conditions:      Liste spezifischer Pruefer
#   forbidden_args:  Argument-Namen, die nicht vorkommen duerfen
#   reason:          Klartext, landet im Audit

# Hinweis: Der konkrete Wert von authorized_networks kommt
# aus PolicyContext. Im Orchestrator-Betrieb ist es die
# breite Liste (10/8, 172.16/12, 192.168/16). In Tests oft
# nur 192.168.178.0/24, um Approval-Faelle zu provozieren.

tools:

  read_logs:
    allowed: true
    level: 0
    conditions:
      - read_only_path
    reason: "Nur Lesen aus erlaubten Log-Pfaden"

  get_devices:
    allowed: true
    level: 0
    conditions: []
    reason: "Inventar-Abfrage, nur lesend"

  whitelist_check:
    allowed: true
    level: 0
    conditions: []
    reason: "Whitelist-Abfrage, nur lesend"

  telegram_alert:
    allowed: true
    level: 0
    conditions: []
    reason: "Benachrichtigung"

  notify_ntfy:
    allowed: true
    level: 1
    conditions: []
    reason: "Benachrichtigung via ntfy"

  nmap_scan:
    allowed: true
    level: 1
    conditions:
      - authorized_target
    forbidden_args:
      - "--script"
      - "-oA"
    reason: "Nmap nur gegen autorisierte Netze"

  # --- net_diag (Punkt 58 Runde 1) ---

  ping:
    allowed: true
    level: 0
    conditions:
      - target_in_scope
    reason: "Ping gegen autorisierte Netze"

  traceroute:
    allowed: true
    level: 0
    conditions:
      - target_in_scope
    reason: "Traceroute gegen autorisierte Netze"

  dns_lookup:
    allowed: true
    level: 0
    conditions: []
    reason: "DNS-Aufloesung"

  port_check:
    allowed: true
    level: 0
    conditions:
      - target_in_scope
    reason: "TCP-Port-Check"

  whois:
    allowed: true
    level: 0
    conditions:
      - target_in_scope
    reason: "whois-Abfrage"

  system_status:
    allowed: true
    level: 0
    conditions: []
    reason: "Systemzustand"

  service_status:
    allowed: true
    level: 0
    conditions: []
    reason: "systemctl is-active (Whitelist)"

  disk_usage:
    allowed: true
    level: 0
    conditions: []
    reason: "Disk-Auslastung"

  network_interfaces:
    allowed: true
    level: 0
    conditions: []
    reason: "Netz-Interfaces"
